name: CI

# Kiataker CI (PRD §45). Every check must pass before merge. main is protected.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kiataker
          POSTGRES_PASSWORD: kiataker
          POSTGRES_DB: kiataker_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kiataker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kiataker:kiataker@localhost:5432/kiataker_dev?schema=public
      SHADOW_DATABASE_URL: postgresql://kiataker:kiataker@localhost:5432/kiataker_shadow?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: psql "$DATABASE_URL" -c "CREATE DATABASE kiataker_shadow;" || true
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy || pnpm db:migrate
      - name: Type-check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Copy lint (banned terms, em dashes, verbs)
        run: pnpm lint:copy
      - name: Unit + integration tests
        run: pnpm test
      - name: Migration drift check
        run: pnpm db:migrate:check

  build:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Build all
        run: pnpm build
